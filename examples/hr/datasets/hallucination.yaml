# Hallucination suite: questions the knowledge base cannot answer.
#
# The only correct behaviour is to say so. Every case asserts
# expected_status: no_answer and lists the invented specifics that must never
# appear, so a confident wrong answer fails loudly rather than scoring well on
# fluency.

schema_version: 2

cases:
  - id: hall-pet-insurance
    description: No such policy exists in the corpus.
    tags: [hallucination]
    risk: high
    turns:
      - user: What is the company policy on pet insurance?
        expect:
          expected_status: no_answer
          prohibited_content: ["pet insurance is", "covered up to", "/\\bpet insurance policy (allows|covers|provides)\\b/"]
          reference_answer: I do not have that information in my knowledge base.

  - id: hall-sabbatical
    tags: [hallucination, known_gap]
    risk: high
    # KNOWN GAP with the offline extractive provider: the corpus shares most of
    # this question's vocabulary, and only the topic word is unknown. Lexical
    # matching cannot see that, so the case fails until a real model is wired
    # in. Left failing on purpose - this is what the suite is for.
    turns:
      - user: How many months of paid sabbatical leave am I entitled to after five years?
        expect:
          expected_status: no_answer
          prohibited_content: ["sabbatical leave is", "months of paid sabbatical"]
          reference_answer: I do not have that information in my knowledge base.

