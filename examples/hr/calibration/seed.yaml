  # ------------------------------------------------------------- borderline #
  # BORDERLINE: "within about a month" is a fair gloss of 30 days, and an unfair
  # one in HR, where a figure is not paraphrasable (CLAUDE.md section 7). Labelled
  # by that rule; a looser labeller would call correctness acceptable.
  - id: syn-borderline-approximate-number
    synthetic: true
    labeller: SYNTHETIC (Claude Code; not an HR owner)
    date: 2026-10-10
    user: How long do I have to submit an expense claim?
    reply: >-
      Expense claims should be submitted within about a month of the expense date.
    reference_answer: >-
      Expense claims must be submitted within 30 days of the expense date.
    retrieved:
