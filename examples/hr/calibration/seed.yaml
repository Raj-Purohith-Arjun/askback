    reference_answer: >-
      A primary caregiver is entitled to 26 weeks of paid parental leave.
    retrieved:
      - doc_id: HR-003
        title: Parental Leave Policy
        text: A primary caregiver is entitled to 26 weeks of paid parental leave.
    labels:
      correctness: acceptable
      completeness: acceptable
      groundedness: acceptable
      reasoning: acceptable
      clarity: acceptable

