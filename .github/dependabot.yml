# Every action is pinned to a full commit SHA, which is correct and means nothing updates unless
# something does. This is the something: it bumps the SHA and rewrites the release comment beside
# it. Weekly, and grouped so a week's bumps are one pull request, not a stream of them.
#
# Observed, not documented: Dependabot's first run (2026-11-22) opened a pull request bumping the
# pins in constraints.txt, so the pip updater does read it. This config covers pyproject.toml's
# declared dependencies, constraints.txt and the workflow actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
